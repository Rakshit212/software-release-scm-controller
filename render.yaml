services:
  - type: web
    name: scm-controller-api
    env: python
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scm-controller-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: scm-controller-db
    databaseName: scm_db
    user: scm_user
