version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: scm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: scm_db
      MYSQL_USER: scm_user
      MYSQL_PASSWORD: scm_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: scm_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://scm_user:scm_password@db/scm_db
      - SECRET_KEY=docker_secret_key_change_me
      - ALGORITHM=HS256
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: scm_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
